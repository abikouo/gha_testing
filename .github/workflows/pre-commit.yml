---
name: pre-commit

# Plain `pull_request`, not `pull_request_target`: this job needs no secrets and
# no write token, so it is unaffected by the December 2 2026 block on
# pull_request_target in public repositories, and it runs identically for forks.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # update_counter.py walks the commit graph. The default shallow clone
          # would make `git rev-list --count HEAD` return 1.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - run: pip install pre-commit

      - run: pre-commit run --all-files --show-diff-on-failure
